<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Стоматология «ДентаЛюкс» в Алматы — лечение без боли, имплантация, эстетика и отбеливание. Опытные врачи, гарантия на работы, рассрочка 0%." />
  <meta name="theme-color" content="#0284C7" />
  <title>ДентаЛюкс — стоматология в Алматы</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- Прелоадер: виден сразу, до загрузки JS. Скрывается из src/main.jsx (hidePreloader). -->
  <style>
    .preloader {
      position: fixed; inset: 0; z-index: 1000;
      display: grid; place-items: center;
      background: #fff;
      transition: opacity .55s ease, visibility .55s;
    }
    .preloader.is-done { opacity: 0; visibility: hidden; }
    .preloader__inner { display: grid; justify-items: center; gap: 18px; transition: transform .55s cubic-bezier(.2,.7,.2,1); }
    .preloader.is-done .preloader__inner { transform: scale(1.08); }
    .preloader__tooth { width: 120px; height: 144px; overflow: visible; animation: pl-float 2.4s ease-in-out 1.6s infinite; }
    .preloader__outline {
      fill: none; stroke: #0284C7; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1;
      animation: pl-draw 1.15s cubic-bezier(.65,0,.35,1) .1s forwards;
    }
    .preloader__fill { fill: #E0F2FE; opacity: 0; animation: pl-fade .5s ease 1.05s forwards; }
    .preloader__shine { transform: translateX(-120px); animation: pl-shine 1s cubic-bezier(.4,0,.2,1) 1.25s forwards; }
    .preloader__spark { fill: #FACC15; transform-origin: 84px 14px; transform: scale(0); animation: pl-spark .5s cubic-bezier(.3,1.6,.5,1) 1.6s forwards; }
    .preloader__name {
      font: 600 18px/1 'Onest', system-ui, sans-serif; letter-spacing: .01em; color: #0F2A3F;
      opacity: 0; animation: pl-fade .5s ease 1.3s forwards;
    }
    .preloader__name b { color: #0284C7; font-weight: 700; }
    @keyframes pl-draw { to { stroke-dashoffset: 0; } }
    @keyframes pl-fade { to { opacity: 1; } }
    @keyframes pl-shine { to { transform: translateX(120px); } }
    @keyframes pl-spark { to { transform: scale(1); } }
    @keyframes pl-float { 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) {
      .preloader__outline { stroke-dashoffset: 0; animation: none; }
      .preloader__fill, .preloader__name { opacity: 1; animation: none; }
      .preloader__spark { transform: scale(1); animation: none; }
      .preloader__shine, .preloader__tooth { animation: none; }
    }
  </style>
</head>
<body>
  <div class="preloader" id="preloader" role="status" aria-label="Загрузка сайта">
    <div class="preloader__inner">
      <svg class="preloader__tooth" viewBox="0 0 100 120" aria-hidden="true">
        <defs>
          <path id="pl-tooth" pathLength="1" d="M50 22C58 12 70 8 78 14C88 22 88 40 84 52C81 60 79 66 78 74C76 88 72 104 66 108C61 111 58 104 57 96C56 86 54 78 50 76C46 78 44 86 43 96C42 104 39 111 34 108C28 104 24 88 22 74C21 66 19 60 16 52C12 40 12 22 22 14C30 8 42 12 50 22Z" />
          <clipPath id="pl-clip"><use href="#pl-tooth" /></clipPath>
          <linearGradient id="pl-shine-grad" x1="0" x2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0" />
            <stop offset=".5" stop-color="#fff" stop-opacity=".95" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </linearGradient>
        </defs>
        <use class="preloader__fill" href="#pl-tooth" />
        <g clip-path="url(#pl-clip)">
          <g transform="rotate(18 50 60)"><rect class="preloader__shine" x="20" y="-10" width="38" height="140" fill="url(#pl-shine-grad)" /></g>
        </g>
        <use class="preloader__outline" href="#pl-tooth" />
        <path class="preloader__spark" d="M84 2l2.6 9.4L96 14l-9.4 2.6L84 26l-2.6-9.4L72 14l9.4-2.6Z" />
      </svg>
      <span class="preloader__name">Дента<b>Люкс</b></span>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
